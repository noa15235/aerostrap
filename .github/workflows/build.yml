name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Publish
        run: dotnet publish .\Aerostrap\Aerostrap.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: Aerostrap
          path: .\Aerostrap\bin\Release\net6.0-windows\win-x64\publish\Aerostrap.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Aerostrap ${{ github.ref_name }}
          files: .\Aerostrap\bin\Release\net6.0-windows\win-x64\publish\Aerostrap.exe
